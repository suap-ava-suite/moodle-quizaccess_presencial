name: Moodle Plugin CI

on:
  push:
    branches:
      - main
      - 'MOODLE_*'
  pull_request:
    branches:
      - main
      - 'MOODLE_*'

permissions:
  contents: read

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:15' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        moodle-branch:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE
        database:
          - pgsql
          - mariadb
        exclude:
          - moodle-branch: MOODLE_405_STABLE
            php: '8.4'
          - moodle-branch: MOODLE_500_STABLE
            php: '8.1'
          - moodle-branch: MOODLE_501_STABLE
            php: '8.1'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, intl, soap, xml, zip, curl
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          (cd ci/bin && pwd) >> "$GITHUB_PATH"
          (cd ci/vendor/bin && pwd) >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
          COMPOSER_NO_AUDIT: 1

      - name: Install Moodle and plugin
        id: install
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
          NODE_OPTIONS: --max-old-space-size=4096

      - name: PHP lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
              matrix.moodle-branch == 'MOODLE_405_STABLE' &&
              matrix.php == '8.3' && matrix.database == 'pgsql' }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
              matrix.moodle-branch == 'MOODLE_405_STABLE' &&
              matrix.php == '8.3' && matrix.database == 'pgsql' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
              matrix.moodle-branch == 'MOODLE_405_STABLE' &&
              matrix.php == '8.3' && matrix.database == 'pgsql' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
              matrix.moodle-branch == 'MOODLE_405_STABLE' &&
              matrix.php == '8.3' && matrix.database == 'pgsql' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
              matrix.moodle-branch == 'MOODLE_405_STABLE' &&
              matrix.php == '8.3' && matrix.database == 'pgsql' }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' &&
              matrix.moodle-branch == 'MOODLE_405_STABLE' &&
              matrix.php == '8.3' && matrix.database == 'pgsql' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat smoke test
        id: behat
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && matrix.php == '8.3' }}
        run: moodle-plugin-ci behat --profile chrome --tags=@quizaccess_presencial

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat faildump (${{ matrix.moodle-branch }}, PHP ${{ matrix.php }}, ${{ matrix.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Install Moodle site for lifecycle tests
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && matrix.php == '8.3' }}
        working-directory: moodle
        run: >-
          php admin/cli/install_database.php
          --agree-license
          --adminpass='Moodle-CI_2026!'
          --fullname='Presencial lifecycle test'
          --shortname='presencial-test'

      - name: Exercise update lifecycle
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && matrix.php == '8.3' }}
        working-directory: moodle
        run: |
          php admin/cli/cfg.php --component=quizaccess_presencial --name=version --set=2026091800
          php admin/cli/cfg.php --name=allversionshash --unset
          php admin/cli/upgrade.php --non-interactive
          test "$(php admin/cli/cfg.php --component=quizaccess_presencial --name=version)" = "2026092100"

      - name: Exercise uninstall lifecycle
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && matrix.php == '8.3' }}
        working-directory: moodle
        run: |
          php admin/cli/uninstall_plugins.php --plugins=quizaccess_presencial --run
          if php admin/cli/cfg.php --component=quizaccess_presencial --name=version; then
            echo 'quizaccess_presencial is still installed after the uninstall command.' >&2
            exit 1
          fi

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
